{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>EduNexus[LMS]</title>

  <link rel="icon" href="{% static 'img/bg.logo.png' %}">

  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700|Nunito:300,400,600,700|Poppins:300,400,500,600,700" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
  <link href="{% static 'vendor/boxicons/css/boxicons.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">

  <!-- CSS for CropperJS, SweetAlert2, MagnifiPopup -->
  <link href="{% static 'vendor/cropperjs/dist/cropper.min.css' %}" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/magnific-popup.min.css">

  <!-- Templates main  CSS File -->
  <link href="{% static 'css/style.css' %}" rel="stylesheet"> 

  <!-- Page-specific extra css -->
  {% block extra_css %}{% endblock %}
</head>

<body>

  {% include 'layout/header.html' %}
  {% include 'layout/sidebar.html' %}

  <main id="main" class="main">
    {% block content %}{% endblock %}
  </main>

  {% include 'layout/footer.html' %}

  <!-- Load Jquery First -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Vendor JS File -->
  <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'vendor/quill/quill.js' %}"></script>
  <script src="{% static 'vendor/tinymce/tinymce.min.js' %}"></script>
  

  <!-- Scripts for CropperJS, SweetAlert2, MagnifiPopup -->
  <script src="{% static 'vendor/cropperjs/dist/cropper.min.js' %}"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/jquery.magnific-popup.min.js"></script>


  <!-- Templates main  JS File -->
  <script src="{% static 'js/main.js' %}"></script>

  <!-- Templates navigator JS File -->
  <script src="{% static 'js/sidebar-nav.js' %}"></script>

  <script src="{% static 'js/dashboard-utils.js' %}"></script>

  {% block extra_scripts %}{% endblock %}

</body>
</html>
