{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNexus [LMS]</title>
    <link rel="icon" type="image/png" href="{% static 'img/bg.logo.png' %}?v=2">
    <link rel="stylesheet" href="{% static 'css/loginstyle.css' %}">
</head>
<body>
    
    <img src="{% static 'img/bg.logo.png' %}" alt="School Crest Watermark" class="school-watermark">

    <div class="login-container">
        <img src="{% static 'img/header.logo.jpg' %}" alt="School Banner" class="header-image">

        <div class="login-card">
            <div class="school-header-text">SIGN-IN</div>
            
            {% if messages %}
                {% for message in messages %}
                    <div style="padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 0.85rem; text-align: center;
                        {% if message.tags == 'error' %} color: #a94442; background-color: #f2dede; border: 1px solid #ebccd1; {% else %} color: #3c763d; background-color: #dff0d8; border: 1px solid #d6e9c6; {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    {{ form.username }}
                </div>
                <div class="form-group">
                    {{ form.password }}
                </div>
                
                <div class="attempts-text">
                    Login Attempts: 0
                </div>

                <div class="form-group">
                    <button type="submit" class="btn-login">LOGIN</button>
                </div>

                <div class="forgot-link-container">
                    <a href="#" class="forgot-password-link">
                        <span class="help-icon">?</span> Forgot Password / Reset Password
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
