{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Teacher Dashboard</title>

    <link rel="icon" type="image/png" href="{% static 'img/bg.logo.png' %}?v=2">
    
    <link rel="stylesheet" href="{% static 'css/teacher.css' %}">
</head>
<body class="dashboard-body">
    
    <header class="dashboard-header">
        <h1>Makiling School | TEACHER PORTAL</h1>
        
        <div class="header-right">
            <div id="real-time-clock" class="clock-text"></div>

            <div class="user-profile">
                <div class="user-info">
                    <span class="user-name">{{ request.user.username }}</span>
                    <span class="user-role">INSTRUCTOR</span>
                </div>
                <img src="https://ui-avatars.com/api/?name={{ request.user.username }}&background=random&color=fff" alt="Profile" class="avatar">
            </div>
        </div>
    </header>

    <main class="dashboard-main">
        <h2>Class Management</h2>
        <div class="dashboard-card">
            <p>This is the teacher area. Here you can upload modules, input grades, and manage student attendance.</p>
        </div>
    </main>

    
</body>
    <script src="{% static 'js/dashboard-utils.js' %}"></script>
</html>
