{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Dashboard</title>

    <link rel="icon" type="image/png" href="{% static 'img/bg.logo.png' %}?v=2">
    
    <link rel="stylesheet" href="{% static 'css/student.css' %}">
</head>
<body class="dashboard-body">
    
    <header class="dashboard-header">
        <h1>Makiling School | STUDENT PORTAL</h1>
        
        <div class="header-right">
            <div id="real-time-clock" class="clock-text"></div>

            <div class="user-profile">
                <div class="user-info">
                    <span class="user-name">{{ request.user.username }}</span>
                    <span class="user-role">STUDENT</span>
                </div>
                <img src="https://ui-avatars.com/api/?name={{ request.user.username }}&background=random&color=fff" alt="Profile" class="avatar">
            </div>
        </div>
    </header>

    <main class="dashboard-main">
        <h2>My Classes & Grades</h2>
        <div class="dashboard-card">
            <p>This is the student area. Here you can view your grades, download modules, and check your attendance.</p>
        </div>
    </main>

    <script>
        let timeoutTimer;

        function resetTimer() {
            clearTimeout(timeoutTimer);
            timeoutTimer = setTimeout(() => {
                window.location.href = "{% url 'logout' %}";
            }, 60000); 
        }

        window.onload = resetTimer;
        document.onmousemove = resetTimer; 
        document.onkeypress = resetTimer;  
        document.onclick = resetTimer;     
        document.onscroll = resetTimer;    
    </script>

    <script>
        function updateLiveClock() {
            const now = new Date();
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            };
            let timeString = now.toLocaleDateString('en-US', options);
            timeString = timeString.replace(',', ' |');
            document.getElementById('real-time-clock').textContent = timeString;
        }

        updateLiveClock();
        setInterval(updateLiveClock, 1000);
    </script>
</body>
</html>
