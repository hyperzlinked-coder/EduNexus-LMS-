{% extends 'account/base.html' %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <link rel="icon" type="image/png" href="{% static 'img/bg.logo.png' %}?v=2">
    
    <link rel="stylesheet" href="{% static 'css/student.css' %}">
</head>
<body class="dashboard-body">
    
    <header class="dashboard-header">
        <h1>Makiling School | STUDENT PORTAL</h1>
        
        <div class="header-right">
            <div id="real-time-clock" class="clock-text"></div>

            <div class="user-profile">
                <div class="user-info">
                    <span class="user-name">{{ request.user.username }}</span>
                    <span class="user-role">STUDENT</span>
                </div>
                <img src="https://ui-avatars.com/api/?name={{ request.user.username }}&background=random&color=fff" 
                     alt="Profile" class="avatar" id="profileTrigger">
            </div>
        </div>
    </header>

    <main class="dashboard-main">
        <h2>My Classes & Grades</h2>
        <div class="dashboard-card">
            <p>This is the student area. Here you can view your grades, download modules, and check your attendance.</p>
        </div>
    </main>

</body>
    <script src="{% static 'js/dashboard-utils.js' %}"></script>
</html>
