{% load static %}

<header id="header" class="header fixed-top d-flex align-items-center">

  <div class="d-flex align-items-center justify-content-between">
    <a href="{% url 'account:admin_dashboard' %}" class="logo d-flex align-items-center">
      <img src="{% static 'img/bg.logo.png' %}" alt="">
      <span class="d-none d-lg-block">EduNexus</span>
    </a>
    <i class="bi bi-list toggle-sidebar-btn"></i>
  </div>

  <nav class="header-nav ms-auto">
    <ul class="d-flex align-items-center">

      <li class="nav-item pe-3 d-none d-md-block">
        <div id="real-time-clock" class="text-muted small fw-bold"></div>
      </li>

      <li class="nav-item dropdown pe-3">

        <a class="nav-link nav-profile d-flex align-items-center pe-0" href="#" data-bs-toggle="dropdown">
          <img src="{% if request.user.profile.profile_picture %}{{ request.user.profile.profile_picture.url }}{% else %}https://ui-avatars.com/api/?name={{ request.user.username }}&background=random&color=fff{% endif %}" 
               alt="Profile" class="rounded-circle" style="width: 35px; height: 35px; object-fit: cover;">
          
          <span class="d-none d-md-block dropdown-toggle ps-2">
            {{ request.user.get_full_name|default:request.user.username|upper }}
          </span>
        </a>

        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">
          <li class="dropdown-header text-start">
            <h6>{{ request.user.get_full_name|default:request.user.username }}</h6>
            <span>{{ request.user.email }}</span>
          </li>
          
          <li><hr class="dropdown-divider"></li>

          <li>
            <a class="dropdown-item d-flex align-items-center" href="{% url 'account:my_profile' %}">
              <i class="bi bi-person"></i>
              <span>My Profile</span>
            </a>
          </li>

          <li><hr class="dropdown-divider"></li>

          <li>
            <a class="dropdown-item d-flex align-items-center" href="{% url 'account:logout' %}">
              <i class="bi bi-box-arrow-right"></i>
              <span>Sign Out</span>
            </a>
          </li>

        </ul>
      </li>
    </ul>
  </nav>
</header>
